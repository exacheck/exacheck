[tool.poetry]
authors = ["Chris <info@exacheck.net>"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: System :: Networking",
]
description = "ExaCheck - ExaBGP Health Checker"
documentation = "https://exacheck.net/deployment/"
homepage = "https://exacheck.net"
keywords = [
  "bgp",
  "exabgp",
  "healthcheck",
  "monitoring",
  "network",
  "networking",
  "networks",
  "routes",
  "routing",
]
name = "exacheck"
readme = "README.md"
repository = "https://github.com/exacheck/exacheck"
version = "0.2.0"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.poetry.urls]
"Changelog" = "https://exacheck.net/development/changelog/"
"Configuration" = "https://exacheck.net/configuration/"
"Docker Deployment" = "https://exacheck.net/deployment/docker/"

[tool.poetry.scripts]
exacheck = 'exacheck.cli:cli'

[tool.poetry.dependencies]
# Python version required
python = ">=3.11,<3.14"

# ExaBGP itself
exabgp = "^5.0.9"

# General ExaCheck requirements
apprise = "^1.10.0"
loguru = "^0.7.3"
pydantic = {extras = ["timezone"], version = "^2.13.4"}
pyyaml = "^6.0.3"
setproctitle = "^1.3.7"
tabulate = "^0.10.0"

# Requirements for the built in health checks
dnspython = "^2.8.0"
icmplib = "^3.0.4"
ntplib = "^0.4.0"
httpx = {extras = ["http2"], version = "^0.28.1"}

# For the CLI
click = "^8.1.8"

# For Sentry support; optional
sentry-sdk = {version = "^2.60.0", optional = true}

[tool.poetry.extras]
sentry = [
  "sentry-sdk",
]
full = [
  "sentry-sdk",
]

# Declare the below groups as optional
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.format]
optional = true

[tool.poetry.group.test]
optional = true

[tool.poetry.group.typing]
optional = true

[tool.poetry.group.dev.dependencies]
# Packages for linting
pycodestyle = "^2.14.0"
pylint = "^4.0.5"
pylint-pydantic = "^0.4.1"
ruff = "^0.15.14"
semgrep = "^1.163.0"

# Misc other development tools
Cython = "^3.2.4"
devtools = {extras = ["pygments"], version = "^0.12.2"}
ipython = "^9.13.0"
Markdown = "^3.10.2"
pipenv = "^2026.6.1"
rich = "^15.0.0"

# Define the packages for the optional groups
[tool.poetry.group.format.dependencies]
# Packages for code formatting
autopep8 = "^2.3.2"
black = "^26.5.1"
flake8 = "^7.3.0"

[tool.poetry.group.test.dependencies]
# Packages for testing
hypothesis = {extras = ["cli"], version = "^6.152.9"}
pytest = "^9.0.3"
pytest-html = "^4.2.0"
respx = "^0.23.1"

[tool.poetry.group.typing.dependencies]
# Packages for type checking
mypy = "^2.1.0"
pyre-check = "^0.9.25"

# Extensions for type checking
types-pyyaml = "^6.0.12.20260518"
types-requests = "^2.33.0.20260518"
types-tabulate = "^0.10.0.20260508"

[tool.autopep8]
# Raise default maximum line length
max_line_length = 120

[tool.flake8]
# Raise default maximum line length
max-line-length = 120

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
log_level = "INFO"
addopts = "-s"

[tool.mypy]
ignore_missing_imports = true
plugins = "pydantic.mypy"
check_untyped_defs = true
