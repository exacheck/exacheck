---

name: Publish container images

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    # `packages: write` is required for pushing to ghcr.io with GITHUB_TOKEN.
    # `contents: read` is the minimum needed for actions/checkout.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tag/label sets for both registries from the release event.
      # Listing both image references here means one build produces tags that
      # point at the same manifest on each registry — the image digest is
      # identical on Docker Hub and ghcr.io.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            exacheck/exacheck
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXACHECK_VERSION=${{ github.event.release.tag_name }}
